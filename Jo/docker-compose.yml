services:
  fastapi:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    image: kibwa14/plantmate_fastapi:latest
    ports:
      - "8080:8080"
    env_file:
      - ./fastapi-backend/.env
    # 중요: .env 파일에 있는 DB 접속 정보보다 아래 환경변수가 우선 적용됩니다.
    # Docker 내부의 mysql_db 컨테이너에 접속하도록 주소를 수정합니다.
    networks:
      - app-network
    restart: always
    # fastapi 컨테이너가 실행되기 전에 mysql_db가 먼저 실행되도록 설정합니다.
    depends_on:
      - mysql_db

  nodejs:
    build:
      context: ./nodejs-backend
      dockerfile: Dockerfile
    image: kibwa14/plantmate_nodejs:latest
    ports:
      - "5000:5000"
    networks:
      - app-network
    restart: always
    depends_on:
      - fastapi
      
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - nodejs
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: always

    # --- 새로 추가할 MySQL 서비스 ---
  mysql_db:
    image: mysql:8.0
    container_name: mysql_container
    # 컨테이너가 삭제되어도 데이터를 보존하기 위한 볼륨 설정입니다.
    volumes:
      - db_data:/var/lib/mysql
    # DB 초기 설정을 위한 환경 변수입니다. (원하는 값으로 변경하세요)
    env_file:
      - ./fastapi-backend/.env
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

# --- 파일 최하단에 새로 추가할 볼륨 정의 ---
volumes:
  db_data: